[functions]
  node_bundler = "esbuild"
[build]
  publish = "dist"
  command = "npm run eleventy && npm run rosey"
  [build.environment]
  # Rosey internationalization. Set to "true" to emit per-locale copies of the
  # site. The original language and the locales to translate into are both
  # configured in rosey.yml.
  ROSEY_ENABLED = "false"
[[plugins]]
package = "netlify-plugin-cache"
  [plugins.inputs]
  # Optional (but highly recommended). Defaults to [".cache"].
  paths = [".cache","dist/assets/images",".clientcache"]
